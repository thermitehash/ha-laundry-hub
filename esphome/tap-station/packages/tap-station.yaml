# Laundry Hub tap station: shared configuration.
# Hardware: M5Stack AtomS3 Lite (ESP32-S3) + Unit NFC U216 (ST25R3916, I2C 0x50)
#           on the Grove port (G2 = SDA, G1 = SCL, 5 V).
#           Fallback reader: Unit RFID2 (WS1850S, rc522_i2c, 0x28).
# Device files set: station_id, device_name, friendly_name and optionally reader.

substitutions:
  # Firmware is not released separately; it tracks the integration version
  # (custom_components/laundry_hub/manifest.json), checked in CI.
  firmware_version: "0.2.1"
  reader: st25r_i2c            # st25r_i2c | rc522
  # Where the st25r_i2c external component lives. "components" = next to the
  # device YAML. Use github://thermitehash/ha-laundry-hub/esphome/tap-station/components@main
  # if you only copy the device files into the ESPHome Device Builder.
  nfc_component_source: components
  debounce_ms: "3000"
  feedback_timeout_ms: "2000"
  mode_idle_timeout_ms: "300000"
  led_pin: GPIO35
  sda_pin: GPIO2
  scl_pin: GPIO1

packages:
  reader: !include readers/${reader}.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Laundry Hub tap station (${station_id})"
  project:
    name: thermitehash.laundry-hub-tap-station
    version: ${firmware_version}
  on_boot:
    priority: -100
    then:
      - script.execute: show_idle

esp32:
  board: m5stack-atoms3
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Home Assistant: esphome.<device_name>_feedback  {result: known|unknown|error|moved}
    - action: feedback
      variables:
        result: string
      then:
        - lambda: id(awaiting_feedback) = false;
        - script.stop: feedback_timeout
        - script.execute:
            id: show_feedback
            result: !lambda "return result;"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} fallback"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  id: grove_i2c
  sda: ${sda_pin}
  scl: ${scl_pin}
  frequency: 100kHz
  scan: true

globals:
  - id: tap_mode            # 0 = auto, 1 = sort, 2 = dry (closets stay 0)
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_uid
    type: std::string
    restore_value: false
  - id: last_uid_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: pending_uid
    type: std::string
    restore_value: false
  - id: awaiting_feedback
    type: bool
    restore_value: false
    initial_value: "false"
  - id: last_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    internal: true
    pin: ${led_pin}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

script:
  # Called by the reader package with the raw UID string from the reader.
  - id: handle_tag
    mode: queued
    max_runs: 4
    parameters:
      raw_uid: string
    then:
      - lambda: |-
          std::string uid;
          for (char c : raw_uid) {
            if (isxdigit(static_cast<unsigned char>(c)))
              uid += static_cast<char>(toupper(static_cast<unsigned char>(c)));
          }
          const uint32_t now = millis();
          id(last_activity_ms) = now;
          if (uid.empty() || (uid == id(last_uid) && now - id(last_uid_ms) < ${debounce_ms})) {
            ESP_LOGD("tap", "Debounced %s", uid.c_str());
            id(pending_uid) = "";
            return;
          }
          id(last_uid) = uid;
          id(last_uid_ms) = now;
          id(pending_uid) = uid;
      - if:
          condition:
            lambda: "return !id(pending_uid).empty();"
          then:
            - logger.log:
                format: "Tap %s at ${station_id} (mode %d)"
                args: ["id(pending_uid).c_str()", "id(tap_mode)"]
            - homeassistant.event:
                event: esphome.laundry_tap
                data:
                  station_id: ${station_id}
                  uid: !lambda "return id(pending_uid);"
                  mode: !lambda |-
                    static const char *const MODES[] = {"auto", "sort", "dry"};
                    int m = id(tap_mode);
                    return std::string(MODES[(m >= 0 && m < 3) ? m : 0]);
            - lambda: id(awaiting_feedback) = true;
            - script.execute: feedback_timeout

  # Local fallback: brief amber blink when Home Assistant does not answer.
  - id: feedback_timeout
    mode: restart
    then:
      - delay: ${feedback_timeout_ms}ms
      - if:
          condition:
            lambda: "return id(awaiting_feedback);"
          then:
            - lambda: id(awaiting_feedback) = false;
            - logger.log:
                level: WARN
                format: "No feedback from Home Assistant"
            - script.execute:
                id: show_feedback
                result: timeout

  - id: show_feedback
    mode: restart
    parameters:
      result: string
    then:
      - lambda: |-
          float r = 1.0f, g = 0.0f, b = 0.0f;  // error (and anything unexpected)
          if (result == "known") { r = 0.0f; g = 1.0f; }
          else if (result == "unknown") { r = 0.0f; b = 1.0f; }
          else if (result == "moved") { g = 1.0f; b = 1.0f; }  // r stays 1: white
          else if (result == "timeout") { g = 0.45f; }
          else if (result != "error") ESP_LOGW("tap", "Unknown feedback result '%s'", result.c_str());
          auto call = id(status_led).turn_on();
          call.set_rgb(r, g, b);
          call.set_brightness(result == "timeout" ? 0.4f : 0.6f);
          call.set_transition_length(0);
          call.perform();
      - delay: !lambda 'return result == "timeout" ? 400 : 1500;'
      - script.execute: show_idle

  # Idle LED shows the tap mode: auto = off, sort = dim purple, dry = dim teal.
  - id: show_idle
    mode: restart
    then:
      - lambda: |-
          if (id(tap_mode) == 0) {
            auto call = id(status_led).turn_off();
            call.set_transition_length(0);
            call.perform();
            return;
          }
          auto call = id(status_led).turn_on();
          if (id(tap_mode) == 1) call.set_rgb(0.6f, 0.0f, 1.0f);
          else call.set_rgb(0.0f, 0.8f, 0.7f);
          call.set_brightness(0.15f);
          call.set_transition_length(0);
          call.perform();

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 120s
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: Station ID
    entity_category: diagnostic
    update_interval: never
    lambda: 'return std::string("${station_id}");'

button:
  - platform: restart
    name: Restart
    entity_category: config
