[project]
name = "ha-laundry-hub"
version = "0.2.3"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["pinned_session: use the real DNS-pinned import session"]

[tool.coverage.run]
source = ["custom_components/laundry_hub"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "C4", "PIE", "RET", "TRY", "D"]
ignore = ["D401", "TRY400", "D203", "D213", "PLR0913", "PLR2004", "TRY003", "PLR0912", "PLR0911", "RUF001", "PLR0915", "D105", "D107", "TRY300"]

[tool.ruff.lint.per-file-ignores]
"custom_components/laundry_hub/taxonomy.py" = ["E501"]  # vocabulary tables
"tests/*" = ["E501", "C416", "D", "ASYNC240", "PLR", "PLC0415", "S101", "SLF001", "RUF", "SIM105", "B017", "TRY"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = false
warn_unused_ignores = true
plugins = []
files = ["custom_components/laundry_hub"]

[tool.mutmut]
source_paths = ["custom_components/laundry_hub/statemachine.py"]
also_copy = ["custom_components", "tests"]
pytest_add_cli_args_test_selection = ["tests/test_statemachine.py"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]

[[tool.mypy.overrides]]
module = "aioimaplib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "homeassistant.*"
implicit_reexport = true
